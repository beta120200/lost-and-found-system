<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost &amp; Found Board</title>
  <link rel="icon" href="./assets/img/logo.svg">
  <script src="assets/js/api.js"></script>
</head>

<body>
  <p style="font-family:sans-serif;padding:40px;color:#666;">Loading…</p>
  <script>
    // index.html just figures out where you belong and sends you there —
    // the real pages are login.html, feed.html, my-posts.html, admin.html.
    api.me().then(function (res) {
      window.location.replace(res.user.role === "admin" ? "admin.html" : "feed.html");
    }).catch(function () {
      window.location.replace("login.html");
    });
  </script>
</body>

</html>
