<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Backdrop: the same mustard "pin" color used for the header brand-mark
       and every pushpin accent across the site. Solid fill so this also
       works standalone as a favicon on any browser theme. -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="#E3A93C"/>

  <!-- Ticket/tag silhouette: the site's own card shape (feed cards, "My
       Posts" nav icon, ticket numbers like #0001) rendered as the logo
       itself, in the site's ink color. Side notches give it the classic
       ticket-stub outline. -->
  <rect x="14" y="24" width="72" height="52" rx="8" fill="#1B1F2A"/>
  <circle cx="14" cy="50" r="8" fill="#E3A93C"/>
  <circle cx="86" cy="50" r="8" fill="#E3A93C"/>

  <!-- Magnifying glass, knocked out of the ticket in the backdrop color —
       the site's core verb: searching for / finding a lost item. Sized
       to stay bold and legible down to a 16px favicon, not just at full
       size — the punch-hole detail from an earlier pass got dropped for
       exactly that reason: fine at 512px, mud at 16px. -->
  <circle cx="43" cy="48" r="13" fill="none" stroke="#E3A93C" stroke-width="7"/>
  <line x1="52.2" y1="57.2" x2="66" y2="71" stroke="#E3A93C" stroke-width="7" stroke-linecap="round"/>
</svg>
